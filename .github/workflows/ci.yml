name: Test, replay and publish
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: womi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
  evidence:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install -r requirements-eval.txt
      - run: python -m pip install --no-deps dist/*.whl
      - run: womi demo --output .build/calibration --worlds 8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: calibration-evidence
          path: .build/calibration/
  replay:
    needs: evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: calibration-evidence
          path: .build/calibration
      - run: python -m pip install -r requirements-eval.txt
      - run: python -m pip install --no-deps dist/*.whl
      - name: Recompute saved arrays on a separate runner
        run: python scripts/replay_bundle.py .build/calibration --output .build/replay.json
      - name: Build the calibration browser
        env:
          SOURCE_REVISION: ${{ github.sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/build_site.py .build/calibration --output .build/site --revision "$SOURCE_REVISION" --ci-url "$CI_RUN_URL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-evidence
          path: |
            .build/replay.json
            .build/site/catalog.json
            .build/site/calibration-evidence.zip
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .build/site
  container:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -t womi-evaluator:test .
      - name: Exercise the offline container without network access
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp womi-evaluator:test demo --output /tmp/calibration --worlds 2
          docker image inspect womi-evaluator:test --format '{{.Id}}' > container-image-id.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-build-identity
          path: container-image-id.txt
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [replay, container]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified browser
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
